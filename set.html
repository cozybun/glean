<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Set 🃏 | Glean 🔮 </title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    #set-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 2rem auto;
      max-width: 480px;
      width: min(480px, 100%);
    }

    main > a,
    #set-message {
      display: block;
      text-align: center;
    }

    body:has(#set-board) {
      max-width: none;
      margin: 0;
      width: 100%;
      box-sizing: border-box;
    }
    
    body:has(#set-board) main {
      width: 100%;
      max-width: none;
      margin: 0;
      box-sizing: border-box;
    }
  
    .set-card {
      aspect-ratio: 3 / 2;
      background: #faf5ff;
      border: 2px solid #d9b7f5;
      border-radius: 12px;
      font-size: 2rem;
      cursor: pointer;
      padding: 8px;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      box-sizing: border-box;
    }

    .set-card svg {
      width: 30%;
      max-width: 45px;
      height: auto;
      flex-shrink: 0;
    }

    .set-card.selected {
      background: #e9d5ff;
      border-color: #9333ea;
      box-shadow: 0 0 0 3px #d8b4fe;
      transform: translateY(-2px);
    }
    
    /* Outlined Set animals */
    .set-card[data-shading="outline"] svg [fill="currentColor"] {
      fill: none;
      stroke: currentColor;
      stroke-width: 5;
      stroke-linejoin: round;
    }
    
    /* Striped Set animals */
    .set-card[data-shading="striped"] svg [fill="currentColor"] {
      stroke: currentColor;
      stroke-width: 3;
      stroke-linejoin: round;
    }    
    .set-card[data-shading="striped"][data-color="green"] svg [fill="currentColor"] {
      fill: url(#stripes-green);
    }    
    .set-card[data-shading="striped"][data-color="red"] svg [fill="currentColor"] {
      fill: url(#stripes-red);
    }
    .set-card[data-shading="striped"][data-color="blue"] svg [fill="currentColor"] {
      fill: url(#stripes-blue);
    }

    .set-home-btn {
      display: table;
      margin: 0 auto;
      padding: 0.75rem 1.4rem;
      background: var(--brand-purple);
      color: white;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
    }
    
    .set-home-btn:hover {
      background: var(--dark-purple);
    }
  </style>
</head>

<body>
  <main>
    <a href="home.html" class="set-home-btn"> Go to Home </a>
    <h1> Set 🃏 </h1>
    <p id="set-message" aria-live="polite"> Select 3 cards to find a Set! 🃏</p>
    
    <div id="set-board">
      <button class="set-card" data-shape="bun" data-color="green" data-number="1" data-shading="solid"> 🐰</button>
      <button class="set-card" data-shape="snake" data-color="red" data-number="2" data-shading="striped"> 🐍 </button>
      <button class="set-card" data-shape="wolf" data-color="blue" data-number="3" data-shading="outline"> 🐺 </button>
    
      <button class="set-card" data-shape="bun" data-color="red" data-number="2" data-shading="outline"> 🐰 </button>
      <button class="set-card" data-shape="snake" data-color="blue" data-number="3" data-shading="solid"> 🐍 </button>
      <button class="set-card" data-shape="wolf" data-color="green" data-number="1" data-shading="striped"> 🐺 </button>
    
      <button class="set-card" data-shape="bun" data-color="blue" data-number="3" data-shading="striped"> 🐰 </button>
      <button class="set-card" data-shape="snake" data-color="green" data-number="1" data-shading="outline"> 🐍 </button>
      <button class="set-card" data-shape="wolf" data-color="red" data-number="2" data-shading="solid"> 🐺 </button>
    
      <button class="set-card" data-shape="bun" data-color="green" data-number="3" data-shading="solid"> 🐰 </button>
      <button class="set-card" data-shape="snake" data-color="red" data-number="1" data-shading="striped"> 🐍 </button>
      <button class="set-card" data-shape="wolf" data-color="blue" data-number="2" data-shading="outline"> 🐺 </button>
    </div>

  </main>
  <script>    
  
  const stripePattern = `
    <svg width="0" height="0" aria-hidden="true"
         xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="stripes-green" width="8" height="8"
                 patternUnits="userSpaceOnUse">
          <path d="M 0 0 L 8 8" stroke="#16a34a" stroke-width="3"/>
        </pattern>
  
        <pattern id="stripes-red" width="8" height="8"
                 patternUnits="userSpaceOnUse">
          <path d="M 0 0 L 8 8" stroke="#dc2626" stroke-width="3"/>
        </pattern>
  
        <pattern id="stripes-blue" width="8" height="8"
                 patternUnits="userSpaceOnUse">
          <path d="M 0 0 L 8 8" stroke="#2563eb" stroke-width="3"/>
        </pattern>
      </defs>
    </svg>
  `;
  
  document.body.insertAdjacentHTML("afterbegin", stripePattern);
  const cards = document.querySelectorAll(".set-card");
    
  const cardColors = {
    green: "#16a34a",
    red: "#dc2626",
    blue: "#2563eb"
  };
      
  const shapes = ["bun", "snake", "wolf"];
  const colors = ["green", "red", "blue"];
  const numbers = [1, 2, 3];
  const shadings = ["solid", "striped", "outline"];  
  const deck = [];
  
  for (const shape of shapes) {
    for (const color of colors) {
      for (const number of numbers) {
        for (const shading of shadings) {
          deck.push({ shape, color, number, shading });
        }
      }
    }
  }  
  console.log("Set deck size:", deck.length);
    
  function shuffleDeck(cards) {
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
  
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
  
    return cards;
  }  
  shuffleDeck(deck);    
  
  function boardHasSet(board) {
    for (let i = 0; i < board.length - 2; i++) {
      for (let j = i + 1; j < board.length - 1; j++) {
        for (let k = j + 1; k < board.length; k++) {
          const threeCards = [board[i], board[j], board[k]];
  
          const valid = ["shape", "color", "number", "shading"].every(property => {
            const values = threeCards.map(card => card[property]);
            const uniqueValues = new Set(values);
  
            return uniqueValues.size === 1 || uniqueValues.size === 3;
          });
  
          if (valid) return true;
        }
      }
    }
  
    return false;
  }
  
  let startingCards = deck.slice(0, 12);  
  while (!boardHasSet(startingCards)) {
    shuffleDeck(deck);
    startingCards = deck.slice(0, 12);
  }
  
  deck.splice(0, 12);  // remove the 12 dealt cards from deck  
  console.log("Starting board has a Set:", boardHasSet(startingCards));
  
  cards.forEach((card, index) => {
    const dealt = startingCards[index];
  
    card.dataset.shape = dealt.shape;
    card.dataset.color = dealt.color;
    card.dataset.number = dealt.number;
    card.dataset.shading = dealt.shading;
  });
  console.log("First 3 shuffled cards:", deck.slice(0, 3));
  
  function findSet(board) {
    for (let i = 0; i < board.length - 2; i++) {
      for (let j = i + 1; j < board.length - 1; j++) {
        for (let k = j + 1; k < board.length; k++) {
          const trio = [board[i], board[j], board[k]];
  
          if (boardHasSet(trio)) {
            return trio;
          }
        }
      }
    }
  
    return null;
  }
    
  function currentBoardHasSet() {
      const board = [...cards]
        .filter(card => card.style.display !== "none")
        .map(card => ({
          shape: card.dataset.shape,
          color: card.dataset.color,
          number: Number(card.dataset.number),
          shading: card.dataset.shading
        }));
  
    return boardHasSet(board);
  }
  
  function isValidSet(selectedCards) {
    const properties = ["shape", "color", "number", "shading"];
  
    return properties.every(property => {
      const values = selectedCards.map(card => card.dataset[property]);
      const uniqueValues = new Set(values);
  
      return uniqueValues.size === 1 || uniqueValues.size === 3;
    });
  }
  
  function renderCard(card) {
    const shape = card.dataset.shape;
    const color = card.dataset.color;
    const number = Number(card.dataset.number);
  
    const emoji = {
      bun: "🐰",
      snake: "🐍",
      wolf: "🐺"
    }[shape];

    if (shape === "bun") {
      const bunny = `
        <svg viewBox="0 0 100 100" width="45" height="45"
             xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="35" cy="25" rx="10" ry="24" fill="currentColor"/>
          <ellipse cx="65" cy="25" rx="10" ry="24" fill="currentColor"/>
          <circle cx="50" cy="62" r="30" fill="currentColor"/>
        </svg>
      `;
    

  card.innerHTML = Array(number).fill(bunny).join("");
  } else if (shape === "snake") {
    const snake = `
      <svg viewBox="0 0 100 100" width="45" height="45"
           xmlns="http://www.w3.org/2000/svg">
        <path d="M 50 18
                 C 25 18, 15 38, 20 62
                 C 25 88, 75 88, 80 62
                 C 85 38, 75 18, 50 18 Z"
              fill="currentColor"/>
        <circle cx="36" cy="47" r="4" fill="none"
                stroke="currentColor" stroke-width="2"/>
        <circle cx="64" cy="47" r="4" fill="none"
                stroke="currentColor" stroke-width="2"/>
        <path d="M 50 67 V 88 M 50 88 L 43 94 M 50 88 L 57 94"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"/>
      </svg>
    `;
  
    
    card.innerHTML = Array(number).fill(snake).join("");
    } else if (shape === "wolf") {
      const wolf = `
        <svg viewBox="0 0 100 100" width="45" height="45"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M 12 10
                   L 35 25
                   Q 50 18 65 25
                   L 88 10
                   L 82 55
                   Q 90 72 72 80
                   Q 65 92 50 88
                   Q 35 92 28 80
                   Q 10 72 18 55 Z"
                fill="currentColor"/>
        </svg>
      `;
    
      card.innerHTML = Array(number).fill(wolf).join("");
    } else {
      card.textContent = Array(number).fill(emoji).join(" ");
    }
    
    card.style.color = cardColors[color];
    }
    cards.forEach(card => renderCard(card));
  
  cards.forEach(card => {
    card.addEventListener("click", () => {
      if (card.classList.contains("selected")) {
        card.classList.remove("selected");
        return;
      }
  
      const selected = document.querySelectorAll(".set-card.selected");
      if (selected.length >= 3) return;
  
      card.classList.add("selected");
  
      const chosenCards = [...document.querySelectorAll(".set-card.selected")];
  
      if (chosenCards.length === 3) {
        const message = document.getElementById("set-message");
  
        if (isValidSet(chosenCards)) {
          message.textContent = "Valid Set! 🎉";
          message.style.color = "#16a34a";
  
          chosenCards.forEach(card => {
            const nextCard = deck.pop();            
            if (!nextCard) {
              card.style.display = "none";
              return;
            }
  
            card.dataset.shape = nextCard.shape;
            card.dataset.color = nextCard.color;
            card.dataset.number = nextCard.number;
            card.dataset.shading = nextCard.shading;
            renderCard(card);
          });
                    
          if (!currentBoardHasSet() && deck.length > 0) {
            const visibleCards = [...cards].filter(
              card => card.style.display !== "none"
            );
          
            const pool = [  // mix the unused deck with cards currently on the board
              ...deck,
              ...visibleCards.map(card => ({
                shape: card.dataset.shape,
                color: card.dataset.color,
                number: Number(card.dataset.number),
                shading: card.dataset.shading
              }))
            ];
          
            const boardSize = visibleCards.length;
            const guaranteedSet = findSet(pool);
            
            if (guaranteedSet) {
              const otherCards = pool.filter(
                card => !guaranteedSet.includes(card)
              );
            
              shuffleDeck(otherCards);
            
              pool.length = 0;
              pool.push(...guaranteedSet, ...otherCards);
            }            
            const newBoard = pool.slice(0, boardSize);
          
            if (boardHasSet(newBoard)) {
              visibleCards.forEach((card, index) => {
                const dealt = newBoard[index];
          
                card.dataset.shape = dealt.shape;
                card.dataset.color = dealt.color;
                card.dataset.number = dealt.number;
                card.dataset.shading = dealt.shading;
                renderCard(card);
              });
          
              deck.length = 0;
              deck.push(...pool.slice(boardSize));
          
              message.textContent = "Valid Set! New board dealt! 🎉";
            }
          }

        const remaining = [...cards].filter(
          card => card.style.display !== "none"
        );
        
        const remainingPool = [
          ...deck,
          ...remaining.map(card => ({
            shape: card.dataset.shape,
            color: card.dataset.color,
            number: Number(card.dataset.number),
            shading: card.dataset.shading
          }))
        ];
        
        if (!boardHasSet(remainingPool)) {
          message.textContent = "Game over! 🎉 No more Sets remain!";
        
          remaining.forEach(card => {
            card.disabled = true;
          });
        } else if (deck.length === 0) {
          message.textContent = "Deck empty! Find the remaining Sets! 🃏";
        }
        } else {
          message.textContent = "Not a Set! Try again 😅";
          message.style.color = "#dc2626";
        }
  
        chosenCards.forEach(chosen => chosen.classList.remove("selected"));
      }
    });
  });
</script>
</body>
</html>
