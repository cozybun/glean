<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Set 🃏 | Glean 🔮 </title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    #set-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 480px;
      margin: 2rem auto;
    }
  
    .set-card {
      aspect-ratio: 3 / 2;
      background: #faf5ff;
      border: 2px solid #d9b7f5;
      border-radius: 12px;
      font-size: 2rem;
      cursor: pointer;
    }

    .set-card.selected {
      background: #e9d5ff;
      border-color: #9333ea;
      box-shadow: 0 0 0 3px #d8b4fe;
      transform: translateY(-2px);
    }
  </style>

</head>

<body>
  <main>
    <a href="home.html"> Go to Home </a>
    <h1> Set 🃏 </h1>    

    <div id="set-board">
      <button class="set-card">🐰</button>
      <button class="set-card">🐍</button>
      <button class="set-card">🐺</button>
      <button class="set-card">🐰</button>
      <button class="set-card">🐍</button>
      <button class="set-card">🐺</button>
      <button class="set-card">🐰</button>
      <button class="set-card">🐍</button>
      <button class="set-card">🐺</button>
      <button class="set-card">🐰</button>
      <button class="set-card">🐍</button>
      <button class="set-card">🐺</button>
    </div>
  </main>
  <script>
  const cards = document.querySelectorAll(".set-card");

  cards.forEach(card => {
    card.addEventListener("click", () => {
      if (card.classList.contains("selected")) {  // clicking a selected card deselects it
        card.classList.remove("selected");
        return;
      }

      const selected = document.querySelectorAll(".set-card.selected"); // allow at most 3 selected cards
      if (selected.length >= 3) return;

      card.classList.add("selected");
    });
  });
</script>
</body>
</html>
